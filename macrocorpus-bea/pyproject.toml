[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bea-corpus"
version = "0.1.0"
description = "BEA slice of the MacroCorpus project: fetch, standardize and profile BEA macro series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bea-corpus = "bea_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
